<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blind Draft · NBA Minigames</title>
  <meta name="description" content="Draft a starting five from anonymous stat lines. Hidden Win Shares decide how good your team really is.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBA Minigames">
  <meta property="og:title" content="Blind Draft · NBA Minigames">
  <meta property="og:description" content="Draft a starting five from anonymous stat lines. Hidden Win Shares decide how good your team really is.">
  <meta property="og:url" content="https://mdivs2121.github.io/NBA-Minigames/blind.html">
  <meta property="og:image" content="https://mdivs2121.github.io/NBA-Minigames/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1015">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NBA Games">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610051001">
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="Games"></nav>
    <div class="rule"></div>

    <header class="topbar">
      <span class="eyebrow">Blind Draft</span>
      <span id="state" class="state">Loading</span>
    </header>

    <p id="status" class="status">Loading seasons…</p>

    <section id="game" hidden>
      <ol id="lineup" class="bd-lineup" aria-label="Your lineup"></ol>

      <div id="drafting">
        <div class="cp-head">
          <span id="round" class="side-label"></span>
          <h1 id="title" class="giant"></h1>
          <p class="meta">Four real seasons, no names. Scoring is close on purpose, so look at the whole line. Hidden Win Shares decide who was best.</p>
        </div>
        <div id="options" class="bd-options"></div>
      </div>

      <section id="result" class="result" hidden>
        <span id="result-kicker" class="label"></span>
        <h2 id="result-title" class="giant"></h2>
        <p id="result-emoji" class="emoji-row" aria-hidden="true"></p>
        <p id="result-text" class="meta"></p>
        <div class="result-actions">
          <button type="button" id="again" class="primary">New draft</button>
          <button type="button" id="share" class="ghost">Share</button>
          <button type="button" id="save-image" class="ghost">Save image</button>
        </div>
        <p id="share-msg" class="message good"></p>
      </section>

      <section id="reveal" class="bd-reveal" hidden></section>
    </section>

    <footer>
      <span class="brand">Blind Draft</span>
      <span>Scout the numbers, not the names.</span>
    </footer>
  </main>
  <script src="common.js?v=202610051001"></script>
  <script src="blind.js?v=202610051001"></script>
</body>
</html>
