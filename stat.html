<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{if(localStorage.getItem("theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stat Line · NBA Minigames</title>
  <meta name="description" content="One real season&#x27;s stat line. Name the player who put it up. Every miss reveals a clue.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBA Minigames">
  <meta property="og:title" content="Stat Line · NBA Minigames">
  <meta property="og:description" content="One real season&#x27;s stat line. Name the player who put it up. Every miss reveals a clue.">
  <meta property="og:url" content="https://mdivs2121.github.io/NBA-Minigames/stat.html">
  <meta property="og:image" content="https://mdivs2121.github.io/NBA-Minigames/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1015">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NBA Games">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610051429">
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="Games"></nav>
    <div class="rule"></div>

    <header class="topbar">
      <span class="eyebrow">Stat Line</span>
      <span id="state" class="state">Loading</span>
    </header>

    <nav class="difficulty" aria-label="Difficulty">
      <button type="button" data-level="easy">Easy · star seasons</button>
      <button type="button" data-level="hard">Hard · any starter</button>
    </nav>

    <p id="status" class="status">Loading seasons…</p>

    <section id="game" hidden>
      <div class="numbers hl-numbers">
        <div><span class="label">Streak</span><b id="streak">0</b></div>
        <div class="right"><span class="label">Best</span><b id="best" class="green">0</b></div>
      </div>

      <div class="cp-head">
        <span id="season" class="side-label"></span>
        <h1 id="answer" class="giant">Whose season?</h1>
      </div>

      <div id="line" class="sl-line"></div>

      <section class="cp-clues">
        <span class="label">Clues · one unlocks with every miss</span>
        <ol id="clues"></ol>
      </section>

      <form id="guess-form" class="guess" autocomplete="off">
        <label for="guess" class="label">Your guess · <span id="left">4</span> left</label>
        <div class="guess-row">
          <input id="guess" list="all-players" placeholder="Start typing a player…">
          <button type="submit" id="guess-btn" class="primary">Guess</button>
        </div>
        <datalist id="all-players"></datalist>
        <p id="message" class="message"></p>
        <div class="actions">
          <button type="button" id="give-up" class="ghost">Give up</button>
        </div>
        <ol id="misses" class="cp-misses"></ol>
      </form>

      <section id="result" class="result" hidden>
        <span id="result-kicker" class="label"></span>
        <div class="cp-reveal">
          <span id="result-photo"></span>
          <h2 id="result-title" class="giant"></h2>
        </div>
        <p id="result-text" class="meta"></p>
        <div class="result-actions">
          <button type="button" id="next" class="primary">Next season</button>
          <button type="button" id="share" class="ghost">Share</button>
          <button type="button" id="save-image" class="ghost">Save image</button>
        </div>
        <p id="share-msg" class="message good"></p>
      </section>
    </section>

    <footer>
      <span class="brand">Stat Line</span>
      <span>The numbers never lie. Names, though…</span>
    </footer>
  </main>
  <script src="common.js?v=202610051429"></script>
  <script src="stat.js?v=202610051429"></script>
</body>
</html>
