<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{if(localStorage.getItem("theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Draft</title>
  <meta name="description" content="Draft real NBA player-seasons against a computer GM. Box scores are shown, Win Shares decide it.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBA Minigames">
  <meta property="og:title" content="Snake Draft · NBA Minigames">
  <meta property="og:description" content="Draft real NBA player-seasons against a computer GM. Box scores are shown, Win Shares decide it.">
  <meta property="og:url" content="https://mdivs2121.github.io/NBA-Minigames/snake.html">
  <meta property="og:image" content="https://mdivs2121.github.io/NBA-Minigames/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1015">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NBA Games">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610051033">
</head>
<body>
  <main class="wide-main">
    <nav class="site-nav" aria-label="Games"></nav>
    <div class="rule"></div>

    <header class="topbar">
      <span class="eyebrow">Snake Draft</span>
      <span id="state" class="state">Loading</span>
    </header>

    <nav class="difficulty" aria-label="Opponent">
      <button type="button" data-level="rookie">Rookie GM</button>
      <button type="button" data-level="allstar">All-Star GM</button>
      <button type="button" data-level="hof">Hall of Fame GM</button>
      <button type="button" data-level="friend">vs a Friend</button>
    </nav>

    <div id="friend-names" class="sd-names" hidden>
      <label><span class="label">Player 1</span><input id="name-you" maxlength="20" autocomplete="off"></label>
      <label><span class="label">Player 2</span><input id="name-bot" maxlength="20" autocomplete="off"></label>
    </div>

    <p id="status" class="status">Loading seasons…</p>

    <section id="game" hidden>
      <div class="sd-head">
        <h1 class="giant">Draft a starting five.</h1>
        <p id="intro" class="meta"></p>
      </div>

      <ol id="order" class="sd-order" aria-label="Pick order"></ol>

      <div class="sd-teams">
        <section class="sd-team">
          <div class="sd-team-head"><span id="you-name" class="label">Your five</span><b id="you-total"></b></div>
          <ol id="you" class="sd-slots"></ol>
        </section>
        <section class="sd-team">
          <div class="sd-team-head"><span id="bot-name" class="label"></span><b id="bot-total"></b></div>
          <ol id="bot" class="sd-slots"></ol>
        </section>
      </div>

      <section id="result" class="result" hidden>
        <span id="result-kicker" class="label"></span>
        <h2 id="result-score" class="giant"></h2>
        <p id="result-text" class="meta"></p>
        <div class="result-actions">
          <button type="button" id="again" class="primary">Draft again</button>
          <button type="button" id="share" class="ghost">Share</button>
          <button type="button" id="save-image" class="ghost">Save image</button>
        </div>
        <p id="share-msg" class="message good"></p>
      </section>

      <section class="sd-pool-wrap">
        <div class="sd-pool-head">
          <span class="label">The pool · 30 seasons</span>
          <div id="filters" class="sd-filters">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="G">Guards</button>
            <button type="button" data-filter="F">Forwards</button>
            <button type="button" data-filter="C">Centers</button>
          </div>
        </div>
        <div id="pool"></div>
      </section>
    </section>

    <footer>
      <span class="brand">Snake Draft</span>
      <span>Win Shares decide it. Box scores can lie.</span>
    </footer>
  </main>
  <script src="common.js?v=202610051033"></script>
  <script src="snake.js?v=202610051033"></script>
</body>
</html>
