<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA Minigames</title>
  <meta name="description" content="Quick NBA games built on real stats, from daily puzzles to drafting against a computer GM.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wide-main">
    <nav class="site-nav" aria-label="Games"></nav>
    <div class="rule"></div>

    <header class="hub-head">
      <span class="side-label">Pick a game</span>
      <h1 class="giant">Prove you know ball.</h1>
      <p class="meta">Real NBA stats, from the 1980s to today. No sign-up, no download. Your streaks and scores save on this device.</p>
    </header>

    <ol id="hub" class="hub"></ol>

    <footer>
      <span class="brand">NBA Minigames</span>
      <span>New Rank the Five puzzle every day.</span>
    </footer>
  </main>
  <script src="common.js"></script>
  <script src="hub.js"></script>
</body>
</html>
