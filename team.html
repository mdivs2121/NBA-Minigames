<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Name the Team · Hindsight</title>
  <meta name="description" content="Name every player on a season's All-NBA, All-Defensive, or All-Rookie team, or a whole roster against the clock.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NBA Minigames">
  <meta property="og:title" content="Hindsight: Name the Team · NBA Minigames">
  <meta property="og:description" content="Name every player on a season's All-NBA, All-Defensive, or All-Rookie team, or a whole roster against the clock.">
  <meta property="og:url" content="https://mdivs2121.github.io/NBA-Minigames/team.html">
  <meta property="og:image" content="https://mdivs2121.github.io/NBA-Minigames/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e1015">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NBA Games">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610021441">
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="Games"></nav>
    <div class="rule"></div>

    <header class="topbar">
      <span class="eyebrow">Name the Team</span>
      <span id="state" class="state">Loading</span>
    </header>

    <p id="status" class="status">Loading teams…</p>

    <section id="game" hidden>
      <nav class="difficulty nt-types" aria-label="Team type">
        <button type="button" data-type="All-NBA">All-NBA</button>
        <button type="button" data-type="All-Defense">All-Defense</button>
        <button type="button" data-type="All-Rookie">All-Rookie</button>
        <button type="button" data-type="Full Roster">Full Roster</button>
      </nav>

      <div class="numbers hl-numbers">
        <div><span class="label">Pass streak</span><b id="streak">0</b></div>
        <div class="right"><span class="label" id="strikes-label">Misses left</span><b id="strikes" class="green">3</b></div>
      </div>

      <div class="dr-head">
        <div>
          <span id="kicker" class="side-label">Name the team</span>
          <h1 id="title" class="giant"></h1>
          <p id="goal" class="meta"></p>
        </div>
        <div class="dr-picker">
          <span class="label">Want another?</span>
          <div class="dr-picker-row">
            <button type="button" id="random-team" class="ghost">Random team</button>
          </div>
        </div>
      </div>

      <ol id="slots" class="nt-slots"></ol>

      <form id="guess-form" class="guess" autocomplete="off">
        <label for="guess" class="label">Name a player on this team</label>
        <div class="guess-row">
          <input id="guess" list="all-players" placeholder="Start typing a player…">
          <button type="submit" id="guess-btn" class="primary">Guess</button>
        </div>
        <datalist id="all-players"></datalist>
        <p id="message" class="message"></p>
        <div class="actions">
          <button type="button" id="give-up" class="ghost">Give up</button>
        </div>
        <ol id="misses" class="cp-misses"></ol>
      </form>

      <section id="result" class="result" hidden>
        <span id="result-kicker" class="label"></span>
        <h2 id="result-title" class="giant"></h2>
        <p id="result-emoji" class="emoji-row" aria-hidden="true"></p>
        <p id="result-text" class="meta"></p>
        <div class="result-actions">
          <button type="button" id="next" class="primary">Next team</button>
          <button type="button" id="share" class="ghost">Share</button>
          <button type="button" id="save-image" class="ghost">Save image</button>
        </div>
        <p id="share-msg" class="message good"></p>
      </section>
    </section>

    <footer>
      <span class="brand">Hindsight</span>
      <span>Hindsight is 20/20. Is yours?</span>
    </footer>
  </main>
  <script src="common.js?v=202610021441"></script>
  <script src="team.js?v=202610021441"></script>
</body>
</html>
